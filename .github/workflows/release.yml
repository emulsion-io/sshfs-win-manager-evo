name: Release builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test SSHFS process parser
        run: npm run test:process

      - name: Read and verify package version
        id: package
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}." >&2
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            command: npm run build:win -- --x64 --publish never
            artifact: windows-x64
            files: build/*.exe
          - name: Linux x64
            runner: ubuntu-latest
            command: npm run build:linux -- --x64 --publish never
            artifact: linux-x64
            files: |
              build/*.AppImage
              build/*.deb
              build/*.rpm
          - name: macOS Apple Silicon
            runner: macos-15
            command: npm run build:mac -- --arm64 --publish never
            artifact: macos-arm64
            files: |
              build/*.dmg
              build/*.zip
          - name: macOS Intel
            runner: macos-15-intel
            command: npm run build:mac -- --x64 --publish never
            artifact: macos-x64
            files: |
              build/*.dmg
              build/*.zip

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: ${{ matrix.command }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: sshfs-manager-evo-${{ needs.validate.outputs.version }}-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: SSHFS Manager Evo ${{ needs.validate.outputs.version }}
          draft: true
          generate_release_notes: true
          files: release/*
